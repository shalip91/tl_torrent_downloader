# Watchlist Downloader — App Config

# --- Sites ---
sites:
  torrentleech:
    enabled: true
    type: torrentleech
    base_url: "https://www.torrentleech.org"
    # time_window: how far back to look (e.g. "-1 day", "-3 day", "-7 day")
    time_window: "-1 day"
    # orderby options: "completed" (most downloaded) | "added" (newest first) | "seeders" | "size" | "name"
    orderby: "completed"
    # order options: "desc" | "asc"
    order: "desc"

  fuzer:
    enabled: true
    type: fuzer
    base_url: "https://www.fuzer.xyz"

# --- Filtering ---
# Minimum seeders required for TorrentLeech (0 = no filter). Fuzer ignores this.
min_seeders: 1

# --- Schedule ---
# Random interval between checks (minutes)
interval_min_minutes: 120
interval_max_minutes: 360

# --- Anti-Detection Delays ---
# Random delay (seconds) added before each HTTP request
request_delay_min_seconds: 3
request_delay_max_seconds: 12

# Random delay (seconds) between finding a match and downloading it
download_delay_min_seconds: 5
download_delay_max_seconds: 20

# --- HTTP Timeouts (seconds) ---
http:
  timeout_rss: 30
  timeout_download: 60

# --- Logging ---
log_level: "INFO"   # DEBUG | INFO | WARNING | ERROR

# --- Recommendations (recommend.py) ---
recommend:
  next_months: 6                   # how many months ahead to look for upcoming releases
  minimum_rating_score_movie: 6.5  # skip movies rated below this (0 = no filter; unrated upcoming content always shown)
  minimum_rating_score_series: 7.0 # skip TV series rated below this
